name: BelaStock - Confirmacao da origem pelo arquivo temporario
on:
  push:
    branches: [audit/www-media-20261024]
    paths: ['.github/workflows/confirmar-origem-www.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Match public WWW to exact VPS website directory
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/home/belastock/htdocs/belastock.com.br
          test -f "$root/wp-config.php"
          probe="$root/bs-origin-probe-20261024.txt"
          if [ -e "$probe" ]; then echo 'Probe filename in use - refusing to overwrite'; exit 1; fi
          cleanup(){ rm -f "$probe"; }
          trap cleanup EXIT
          marker="belastock-probe-$(openssl rand -hex 16)"
          printf '%s\n' "$marker" > "$probe"
          chmod 644 "$probe"
          local_file=$(mktemp)
          public_file=$(mktemp)
          trap 'rm -f "$probe" "$local_file" "$public_file"' EXIT
          local_status=$(curl -ks --noproxy '*' --resolve www.belastock.com.br:443:127.0.0.1 --max-time 15 --max-redirs 0 -o "$local_file" -w '%{http_code}' https://www.belastock.com.br/bs-origin-probe-20261024.txt)
          public_status=$(curl -sS --max-time 20 --max-redirs 0 -o "$public_file" -w '%{http_code}' https://www.belastock.com.br/bs-origin-probe-20261024.txt)
          echo "LOCAL_ORIGIN_PROBE_HTTP=$local_status BYTES=$(wc -c < "$local_file")"
          echo "PUBLIC_CF_PROBE_HTTP=$public_status BYTES=$(wc -c < "$public_file")"
          if [ "$local_status" = '200' ] && grep -qF "$marker" "$local_file"; then echo 'LOCAL_ORIGIN_MARKER_VERIFIED=yes';else echo 'LOCAL_ORIGIN_MARKER_VERIFIED=no';fi
          if [ "$public_status" = '200' ] && grep -qF "$marker" "$public_file"; then echo 'PUBLIC_REACHES_THE_SAME_VPS=yes';else echo 'PUBLIC_REACHES_THE_SAME_VPS=no';fi
          echo 'PROBE_CLEANUP_QUEUED'
          REMOTE
