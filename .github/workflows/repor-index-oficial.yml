name: BelaStock - Arquivo oficial index WP checksum
on:
  push:
    branches: [audit/www-media-20261024]
    paths: ['.github/workflows/repor-index-oficial.yml']
permissions:
  contents: read
jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtain index.php from exact WordPress release
        run: |
          set -euo pipefail
          curl -fLsS --max-time 70 --retry 2 https://downloads.wordpress.org/release/wordpress-7.1.3.tar.gz -o "$RUNNER_TEMP/wp-official.tgz"
          tar -xOzf "$RUNNER_TEMP/wp-official.tgz" wordpress/index.php > "$RUNNER_TEMP/bs-wp-index-official.php"
          test -s "$RUNNER_TEMP/bs-wp-index-official.php"
          grep -q "wp-blog-header.php" "$RUNNER_TEMP/bs-wp-index-official.php"
          grep -q "WP_USE_THEMES" "$RUNNER_TEMP/bs-wp-index-official.php"
          php -l "$RUNNER_TEMP/bs-wp-index-official.php"
          echo "WP_OFFICIAL_INDEX_HASH=$(sha256sum "$RUNNER_TEMP/bs-wp-index-official.php" | cut -d' ' -f1)"
      - name: Install exactly the one official core file
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$KNOWN"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
          remote=/tmp/bs-wp-index-official-20261024.php
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/bs-wp-index-official.php" "$USER@$HOST:$remote"
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/home/belastock/htdocs/belastock.com.br
          src=/tmp/bs-wp-index-official-20261024.php
          trap 'rm -f "$src"' EXIT
          test -f "$root/wp-config.php" && test -f "$root/wp-blog-header.php" && test -s "$src"
          test ! -L "$root/index.php"
          test "$(cd "$root" && wp core version --allow-root --skip-plugins --skip-themes)" = '7.1.3'
          grep -qF 'WP_USE_THEMES' "$root/index.php"
          php -l "$src"
          chown --reference="$root/index.php" "$src"
          chmod 644 "$src"
          mv -f "$src" "$root/index.php"
          cd "$root"
          echo '=== WORDPRESS CORE CHECKSUMS ==='
          wp core verify-checksums --allow-root --skip-plugins --skip-themes
          echo '=== HTTPS ORIGIN PAGE ==='
          curl -sk --noproxy '*' --resolve www.belastock.com.br:443:127.0.0.1 --max-time 20 \
            -o /dev/null -w 'ROOT_HTTP=%{http_code} HTML_BYTES=%{size_download}\n' https://www.belastock.com.br/
          echo 'OFFICIAL_INDEX_INSTALLED_AND_VERIFIED'
          REMOTE
