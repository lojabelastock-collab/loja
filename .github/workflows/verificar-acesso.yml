name: Bela Stock - Verificar acesso VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-acesso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmar secrets exclusivos da loja
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for item in HOST USER KEY KNOWN; do
            if [ -z "${!item}" ]; then echo "::error::Secret obrigatorio ausente: $item"; exit 1; fi
          done
      - name: Testar SSH sem alterar a VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -- "$DEPLOY_USER@$DEPLOY_HOST" 'printf "Conexao SSH Bela Stock: OK\n"; id -un; hostname'
