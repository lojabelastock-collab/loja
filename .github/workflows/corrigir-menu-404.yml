name: Bela Stock - Corrigir menu e 404
on:
  push:
    paths:
      - scripts/corrigir-categorias-404.php
      - .github/workflows/corrigir-menu-404.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: php -l scripts/corrigir-categorias-404.php
      - name: Atualizar categorias e URLs
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/key ~/.ssh/known_hosts
          opts=(-i ~/.ssh/key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${opts[@]}" scripts/corrigir-categorias-404.php "$USER@$HOST:/tmp/bs-menu-${GITHUB_RUN_ID}.php"
          ssh "${opts[@]}" "$USER@$HOST" "RID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          site=/home/belastock-loja/htdocs/loja.belastock.com.br
          file="/tmp/bs-menu-${RID}.php"
          trap 'rm -f "$file"' EXIT
          test -f "$site/wp-config.php"
          cd "$site"
          runuser -u belastock-loja -- wp eval-file "$file"
          REMOTE
