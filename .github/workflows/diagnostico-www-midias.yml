name: BelaStock WWW - Diagnostico de dominio e origem (leitura)
on:
  push:
    branches: [audit/www-media-20261024]
    paths: ['.github/workflows/diagnostico-www-midias.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: HTTP public without following redirects
        shell: bash
        run: |
          set -uo pipefail
          for url in https://belastock.com.br/ https://www.belastock.com.br/ https://belastock.com.br/wp-admin/ https://www.belastock.com.br/wp-admin/; do
            echo "=== PUBLIC $url ==="
            curl --max-time 15 --max-redirs 0 -sS -o /dev/null -D /tmp/bs_headers \
              -w 'HTTP_RESULT status=%{http_code} effective=%{url_effective} redirs=%{num_redirects}\n' "$url" || true
            grep -iE '^(HTTP/|location:|server:|cf-cache-status:|x-redirect-by:|cache-control:)' /tmp/bs_headers | head -12 || true
          done
      - name: Inspect Nginx and WordPress on canonical site only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HOST" || -z "$USER" || -z "$KEY" || -z "$KNOWN" ]]; then
            echo 'BLOCKED: one or more loja SSH credentials missing'; exit 0
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/bs_audit_key"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/bs_audit_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/bs_audit_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          conf=/etc/nginx/sites-enabled/belastock.com.br.conf
          root=/home/belastock/htdocs/belastock.com.br
          echo '=== NGINX canonical virtual host ==='
          if [ -f "$conf" ]; then
            echo "configuration=$conf"
            grep -nE 'server_name|^[[:space:]]*root |^[[:space:]]*return |^[[:space:]]*rewrite |^[[:space:]]*proxy_pass |fastcgi_pass|listen ' "$conf" | head -60 || true
          else
            echo 'Canonical Nginx config not found at expected location'
          fi
          echo '=== LOCAL ORIGIN HTTP (no redirects followed) ==='
          for domain in belastock.com.br www.belastock.com.br; do
            for scheme in https http; do
              if [ "$scheme" = https ]; then port=443; else port=80; fi
              echo "Origin domain=$domain scheme=$scheme"
              curl -k --resolve "$domain:$port:127.0.0.1" --noproxy '*' -sS \
                --max-time 10 --max-redirs 0 -o /dev/null -D /tmp/bs_origin_headers \
                -w 'ORIGIN_RESULT status=%{http_code} redirects=%{num_redirects}\n' "$scheme://$domain/" || true
              grep -iE '^(HTTP/|location:|x-redirect-by:|server:)' /tmp/bs_origin_headers | head -8 || true
            done
          done
          echo '=== WP canonical installation ==='
          if [ ! -f "$root/wp-config.php" ]; then echo 'WP-config missing; stop'; exit 0; fi
          for name in home siteurl upload_path upload_url_path; do
            echo -n "WP_OPTION $name: "
            (cd "$root" && wp option get "$name" --allow-root --skip-plugins --skip-themes 2>/dev/null) || echo '[not set]'
          done
          echo '=== WP paths and active identity ==='
          (cd "$root" && wp theme list --status=active --field=name --allow-root --skip-plugins --skip-themes 2>/dev/null) || true
          (cd "$root" && wp plugin list --status=active --field=name --allow-root --skip-plugins --skip-themes 2>/dev/null | head -50) || true
          echo '=== WP local/old address references (counts only) ==='
          (cd "$root" && wp db query "SELECT 'options_local' AS area, COUNT(*) AS total FROM $(wp db prefix --allow-root --skip-plugins --skip-themes)options WHERE option_value LIKE '%tracosnativos.local%' OR option_value LIKE '%localhost%'; SELECT 'postmeta_local' AS area,COUNT(*) AS total FROM $(wp db prefix --allow-root --skip-plugins --skip-themes)postmeta WHERE meta_value LIKE '%tracosnativos.local%' OR meta_value LIKE '%localhost%'; SELECT 'posts_local' AS area,COUNT(*) AS total FROM $(wp db prefix --allow-root --skip-plugins --skip-themes)posts WHERE post_content LIKE '%tracosnativos.local%' OR post_content LIKE '%localhost%';" --allow-root --skip-plugins --skip-themes 2>/dev/null) || echo 'Reference counts unavailable'
          echo '=== Legacy tracosnativos.local DB rows (identifiers only) ==='
          (cd "$root" && wp db query "SELECT 'options' area, option_id record_id, option_name marker, (LENGTH(option_value)-LENGTH(REPLACE(option_value,'tracosnativos.local','')))/LENGTH('tracosnativos.local') instances FROM $(wp db prefix --allow-root --skip-plugins --skip-themes)options WHERE option_value LIKE '%tracosnativos.local%'; SELECT 'postmeta' area, post_id record_id, meta_key marker,(LENGTH(meta_value)-LENGTH(REPLACE(meta_value,'tracosnativos.local','')))/LENGTH('tracosnativos.local') instances FROM $(wp db prefix --allow-root --skip-plugins --skip-themes)postmeta WHERE meta_value LIKE '%tracosnativos.local%'; SELECT 'posts' area, ID record_id, post_type marker,(LENGTH(post_content)-LENGTH(REPLACE(post_content,'tracosnativos.local','')))/LENGTH('tracosnativos.local') instances FROM $(wp db prefix --allow-root --skip-plugins --skip-themes)posts WHERE post_content LIKE '%tracosnativos.local%';" --allow-root --skip-plugins --skip-themes 2>/dev/null) || echo 'Legacy reference SQL inspection unavailable'
          echo '=== Absolute legacy reference in site files (filenames only) ==='
          grep -rilE 'tracosnativos\.local' "$root/wp-content/themes" "$root/wp-content/plugins" "$root/.htaccess" 2>/dev/null | head -30 || true
          echo '=== Backup tooling available ==='
          if command -v rclone >/dev/null 2>&1; then echo 'rclone=installed'; rclone listremotes 2>/dev/null | sed 's/.$//' | head -12 || true; else echo 'rclone=absent'; fi
          if command -v mysqldump >/dev/null 2>&1; then echo 'mysqldump=installed'; else echo 'mysqldump=absent'; fi
          echo '=== Exact legacy counts via WP-CLI dry run ==='
          (cd "$root" && wp search-replace 'tracosnativos.local' 'www.belastock.com.br' --all-tables-with-prefix --dry-run --precise --skip-columns=guid --report-changed-only --allow-root --skip-plugins --skip-themes 2>/dev/null) || echo 'Dry run unavailable'
          echo '=== Plugin legacy references with two lines context ==='
          if [ -f "$root/wp-content/plugins/belastock-ai-admin/belastock-ai-admin.php" ]; then
             grep -n -C 2 'tracosnativos\.local' "$root/wp-content/plugins/belastock-ai-admin/belastock-ai-admin.php" | head -55 || true
          fi
          echo '=== WP config identity overrides (names only) ==='
          if grep -qE 'WP_HOME|WP_SITEURL' "$root/wp-config.php"; then grep -nE 'WP_HOME|WP_SITEURL' "$root/wp-config.php" | sed -E "s/(WP_HOME|WP_SITEURL)['\\\", ]+,.*;/\1 (configured, value redacted);/" | head -12; fi
          echo '=== Nginx first server block (redacted certificate paths) ==='
          if [ -f "$conf" ]; then head -16 "$conf" | sed -E 's@(/etc/letsencrypt|/etc/ssl|/home/)[^; ]+@[redacted-path]@g'; fi
          echo '=== Effective Nginx loaded configurations (filenames only) ==='
          nginx -T 2>&1 | grep -E '^# configuration file /etc/nginx/.*(belastock|sites-enabled/)' | grep -E '(belastock|sites-enabled)' | head -30 || true
          echo '=== Nginx syntax validation and conflicting server_name warnings ==='
          nginx -t 2>&1 | grep -E 'conflicting server name|test is|syntax is' | head -20 || true
          echo '=== WP current upload URL sample ==='
          (cd "$root" && wp eval 'echo wp_get_upload_dir()["baseurl"].PHP_EOL;' --allow-root --skip-plugins --skip-themes 2>/dev/null) || true
          echo 'Read-only end'
          REMOTE
